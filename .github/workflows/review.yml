name: Core source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path engine/stockmesh/Cargo.toml
  monad-executor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: engine/stockmesh/contracts/monad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: engine/stockmesh/contracts/monad/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
  monad-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
      - run: cargo test --locked --manifest-path engine/stockmesh/host/Cargo.toml monad:: --lib
      - run: cargo test --locked --manifest-path engine/stockmesh/host/Cargo.toml --bin monad-order-api
