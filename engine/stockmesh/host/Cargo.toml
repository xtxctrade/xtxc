[package]
name = "skew-execution-host"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
skew-native = { path = "../native" }
skew-engine = { path = ".." }
stocklana-adapters = { path = "../adapters" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
crc32fast = "1"
fs2 = "0.4"
base64 = "0.22"
bs58 = "0.5"
ed25519-dalek = "2"
bincode = "1.3"
solana-message = { version = "=3.1.0", features = ["bincode"] }
solana-hash = "=3.1.0"
solana-instruction = "=3.3.0"
# 4.1 is also admitted by the captured Agave/Mollusk runtime. The standalone
# host retains its 4.3 lock; sharing the compiler must not upgrade the SVM.
solana-pubkey = { version = "4.1", features = ["curve25519", "sha2"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }

[workspace]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"
